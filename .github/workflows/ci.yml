name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_TEST_URL: mongodb://localhost:27117/records?replicaSet=rs0&retryWrites=false&directConnection=true
      LOG_LEVEL: silent
      CI: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests (docker-compose Mongo)
        run: npm run test:e2e

      - name: Build app
        run: npm run build
